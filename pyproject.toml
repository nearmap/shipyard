# Tool configuration and the pixi workspace that runs `sy_tools/`. There is deliberately no
# `[project]` table: `sy_tools/` is run in place with `python -m sy_tools.server` (via the
# `sy-server` pixi task), not installed as a distribution.
#
# Dependencies are floating/lower-bound only. Reproducibility comes from the committed
# `pixi.lock`, not from manifest pins, so the manifest states real API floors and nothing else.

[tool.pixi.workspace]
channels = ["https://prefix.dev/github-releases", "conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = "*"
gitleaks = "*"
ruff = "*"
ty = "*"
pytest = "*"

# `mcp` pulls the first three in already, but this package imports them directly — the Jira adapter
# speaks httpx2, the GitHub adapter offloads its blocking `gh` calls with anyio, and both the tool
# surface and `sy_tools/ship_metrics.py` declare their schemas with pydantic — so they are declared
# rather than inherited from a transitive edge that is free to move. `marklas` is the
# Markdown/rich-text converter the Jira adapter calls in process. Its floor is `>=0.8.2` because
# marklas is pre-1.0 and has already removed public API in a minor bump (0.7.0 dropped
# `walk`/`transform`), so an unbounded constraint would let a resolver pick a release whose
# converter API this adapter does not speak.
[tool.pixi.pypi-dependencies]
mcp = ">=2.0.0"
httpx2 = "*"
anyio = "*"
pydantic = ">=2.0"
marklas = ">=0.8.2"

[tool.pixi.tasks]
sy-server = "python -m sy_tools.server"
pytest = "pytest"
# `migrate` is the only subcommand `scripts/sy_config.py` still carries, so the verb is baked in here
# and pixi's appended arguments are its flags: `pixi run sy-config --settings <path> --out <path>`.
sy-config = "python scripts/sy_config.py migrate"
validate = "python scripts/validate.py"
# The interpreter is named rather than left to the `#!` line: `[tool.pixi.workspace]` declares win-64,
# where a shebang means nothing, and the script is bash-specific (`local`, `[[ ]]`, `(( ))`). Same
# spelling `scripts/validate.py::run_self_test` already uses to run it.
ci-poll = "bash scripts/ci_poll.sh"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ty.environment]
root = ["."]

[tool.pytest.ini_options]
testpaths = ["sy_tools"]
python_files = ["test_*.py"]
addopts = "-q"
